# SPDX-License-Identifier: Apache-2.0
name: native-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            preset: ci-linux-gcc
          - runner: ubuntu-24.04
            preset: ci-linux-clang
          - runner: ubuntu-24.04-arm
            preset: ci-linux-gcc
          - runner: windows-2025-vs2026
            preset: ci-windows-msvc
          - runner: macos-15
            preset: ci-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  windows-arm64:
    runs-on: windows-11-vs2026-arm
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build and test native ARM64 product
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=arm64 -host_arch=arm64
          cmake --preset ci-windows-msvc
          cmake --build --preset ci-windows-msvc
          ctest --preset ci-windows-msvc

  linux-aarch64-cross:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install AArch64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Configure and build complete AArch64 product
        run: |
          cmake --preset ci-linux-aarch64
          cmake --build --preset ci-linux-aarch64
          file build/ci-linux-aarch64/apps/mol-keyboardd/mol-keyboardd
          file build/ci-linux-aarch64/apps/molctl/molctl

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 origin dfb9d1a46c3bb8f52e1e6324be23123b9d73c190
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.5
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.5
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
      - name: Configure, build, and test Wasm
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          cmake --preset wasm-release
          cmake --build --preset wasm-release
          ctest --preset wasm-release

  release-size:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 origin dfb9d1a46c3bb8f52e1e6324be23123b9d73c190
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.5
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.5
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
      - name: Build optimized Web artifacts
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          cmake --preset wasm-release
          cmake --build --preset wasm-release
          npm --prefix apps/web ci
          npm --prefix apps/web run build
      - name: Build portable native distribution
        run: |
          cmake --preset package-release
          cmake --build --preset package-release
      - name: Enforce release size budgets
        run: |
          python3 tools/release_size_gate.py \
            --native-core build/package-release/libmol_core.a \
            --daemon build/package-release/apps/mol-keyboardd/mol-keyboardd \
            --cli build/package-release/apps/molctl/molctl \
            --wasm build/wasm-release/platforms/web/emscripten/mol_core.wasm \
            --web-dir apps/web/dist \
            --report-dir build/size-report
      - name: Create and audit portable package
        shell: bash
        run: |
          cpack --config build/package-release/CPackConfig.cmake -B build/packages
          python3 tools/package_audit.py \
            --archive build/packages/mol-keyboard-*.tar.gz \
            --report-dir build/package-audit \
            --expected-version 0.1.0

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure and build coverage target
        run: |
          cmake --preset coverage-clang
          cmake --build --preset coverage-clang
      - name: Enforce core coverage thresholds
        run: |
          python3 tools/coverage_gate.py \
            --build-dir build/coverage-clang \
            --source-dir .

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure and build analysis target
        run: |
          cmake --preset static-analysis-clang
          cmake --build --preset static-analysis-clang
      - name: Analyze first-party production sources
        run: python3 tools/static_analysis.py --build-dir build/static-analysis-clang

  thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure and build ThreadSanitizer target
        run: |
          cmake --preset tsan-clang
          cmake --build --preset tsan-clang
      - name: Test concurrent production paths
        run: ctest --preset tsan-clang

  endurance:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build optimized endurance targets
        run: |
          cmake --preset endurance
          cmake --build --preset endurance
      - name: Run simulated 30-minute performance and recovery tests
        run: ctest --test-dir build/endurance --output-on-failure -L endurance

  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install exact Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 origin dfb9d1a46c3bb8f52e1e6324be23123b9d73c190
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.5
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.5
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
      - name: Build Android application and device test
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          platforms/android/build-app.sh Debug
          MOL_SKIP_WEB_BUILD=1 platforms/android/build-app.sh DebugAndroidTest
          MOL_SKIP_WEB_BUILD=1 platforms/android/build-app.sh Release
          (
            cd platforms/android
            ./gradlew :app:lintDebug --no-daemon --no-configuration-cache
          )

  ios:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 origin dfb9d1a46c3bb8f52e1e6324be23123b9d73c190
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.5
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.5
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
      - name: Build simulator and device applications
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          platforms/ios/build-app.sh Simulator
          MOL_SKIP_WEB_BUILD=1 platforms/ios/build-app.sh Device
