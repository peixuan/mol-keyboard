# SPDX-License-Identifier: Apache-2.0
name: native-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            preset: ci-linux-gcc
          - runner: ubuntu-24.04
            preset: ci-linux-clang
          - runner: ubuntu-24.04-arm
            preset: ci-linux-gcc
          - runner: windows-2025-vs2026
            preset: ci-windows-msvc
          - runner: macos-15
            preset: ci-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Activate MSVC toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: platforms/windows/export-msvc-env.ps1 -EnvironmentFile $env:GITHUB_ENV
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  macos-desktop:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 origin dfb9d1a46c3bb8f52e1e6324be23123b9d73c190
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.5
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.5
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
      - name: Build optimized Web artifacts
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          cmake --preset wasm-release
          cmake --build --preset wasm-release
          npm --prefix apps/web ci
          npm --prefix apps/web run build
      - name: Build both macOS desktop GUI applications
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          cmake --preset ci-macos-desktop
          cmake --build --preset ci-macos-desktop --parallel 3
      - name: Exercise WKWebView and native debugger
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          ctest --preset ci-macos-desktop \
            -R 'mol_(desktop_(web_server|app_support|webview)|native_debug)'
      - name: Create and audit macOS desktop package
        shell: bash
        run: |
          cpack --config build/ci-macos-desktop/CPackConfig.cmake -B build/packages-macos
          shopt -s nullglob
          archives=(build/packages-macos/mol-keyboard-*.tar.gz)
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one macOS package, found ${#archives[@]}." >&2
            exit 1
          fi
          python3 tools/package_audit.py \
            --archive "${archives[0]}" \
            --report-dir build/package-macos-audit \
            --expected-version 0.1.0

  resource-profiles:
    strategy:
      fail-fast: false
      matrix:
        preset: [profile-tiny, profile-standard, profile-full]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure resource profile
        run: cmake --preset ${{ matrix.preset }}
      - name: Build resource profile
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test resource profile
        run: ctest --preset ${{ matrix.preset }}

  windows-arm64:
    runs-on: windows-11-vs2026-arm
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build and test native ARM64 product
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=arm64 -host_arch=arm64
          cmake --preset ci-windows-msvc
          cmake --build --preset ci-windows-msvc
          ctest --preset ci-windows-msvc

  shared-core:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025-vs2026, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Activate MSVC toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: platforms/windows/export-msvc-env.ps1 -EnvironmentFile $env:GITHUB_ENV
      - name: Configure shared core
        run: cmake --preset ci-shared
      - name: Build shared core and consumers
        run: cmake --build --preset ci-shared
      - name: Test shared core behavior
        run: ctest --preset ci-shared
      - name: Install ABI compliance tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends abi-dumper abi-compliance-checker
      - name: Check v1 public symbols and ABI compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          nm --dynamic --defined-only --format=posix \
            build/ci-shared/libmol_core.so.0.1.0 \
            | cut -d ' ' -f 1 | LC_ALL=C sort > build/mol_core-current.symbols
          diff -u abi/mol_core-1.0.symbols build/mol_core-current.symbols
          abi-dumper build/ci-shared/libmol_core.so.0.1.0 \
            -lver current -o build/mol_core-current.dump
          abi-compliance-checker -l mol_core \
            -old abi/mol_core-1.0.dump \
            -new build/mol_core-current.dump \
            -report-path build/mol_core-abi-report.html

  linux-aarch64-cross:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install AArch64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user
      - name: Configure, build, and emulate complete AArch64 product
        run: |
          cmake --preset ci-linux-aarch64
          cmake --build --preset ci-linux-aarch64
          file build/ci-linux-aarch64/apps/mol-keyboardd/mol-keyboardd
          file build/ci-linux-aarch64/apps/molctl/molctl
          python3 tools/aarch64_emulation_gate.py \
            --qemu /usr/bin/qemu-aarch64 \
            --sysroot /usr/aarch64-linux-gnu \
            --build-dir build/ci-linux-aarch64 \
            --artifact-commit "$GITHUB_SHA" \
            --report build/aarch64-emulation-report.json
      - name: Run AArch64 test binaries under QEMU
        run: |
          cmake --preset ci-linux-aarch64-qemu
          cmake --build --preset ci-linux-aarch64-qemu
          ctest --preset ci-linux-aarch64-qemu
      - name: Run virtual ESP32 hardware models and fault injection
        run: |
          python3 tests/hardware/esp32_hil.py --simulate --target esp32 \
            --report build/esp32-simulated-hil.json
          python3 tests/hardware/esp32_hil.py --simulate --target esp32s3 \
            --report build/esp32s3-simulated-hil.json
          if python3 tests/hardware/esp32_hil.py --simulate --target esp32 \
              --inject-fault deadline-miss; then
            echo "fault-injected HIL unexpectedly passed" >&2
            exit 1
          fi

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 origin dfb9d1a46c3bb8f52e1e6324be23123b9d73c190
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.5
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.5
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
      - name: Configure, build, and test Wasm
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          cmake --preset wasm-release
          cmake --build --preset wasm-release
          ctest --preset wasm-release
      - name: Build native daemon for browser acceptance
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          cmake --preset ci-linux-gcc
          cmake --build --preset ci-linux-gcc
      - name: Install locked Web dependencies and browsers
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          npm --prefix apps/web ci
          node apps/web/scripts/run-browser-tests.mjs install --with-deps chromium firefox webkit
      - name: Test production Web application with real daemon
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          npm --prefix apps/web test
          MOL_DAEMON="$PWD/build/ci-linux-gcc/apps/mol-keyboardd/mol-keyboardd" \
            npm --prefix apps/web run test:browser

  release-size:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Linux desktop GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 origin dfb9d1a46c3bb8f52e1e6324be23123b9d73c190
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.5
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.5
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
      - name: Build optimized Web artifacts
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          cmake --preset wasm-release
          cmake --build --preset wasm-release
          npm --prefix apps/web ci
          npm --prefix apps/web run build
      - name: Build portable native distribution
        run: |
          cmake --preset package-release
          cmake --build --preset package-release
      - name: Enforce release size budgets
        run: |
          python3 tools/release_size_gate.py \
            --native-core build/package-release/libmol_core.a \
            --daemon build/package-release/apps/mol-keyboardd/mol-keyboardd \
            --cli build/package-release/apps/molctl/molctl \
            --wasm build/wasm-release/platforms/web/emscripten/mol_core.wasm \
            --web-dir apps/web/dist \
            --report-dir build/size-report
      - name: Create and audit portable package
        shell: bash
        run: |
          cpack --config build/package-release/CPackConfig.cmake -B build/packages
          xvfb-run -a python3 tools/package_audit.py \
            --archive build/packages/mol-keyboard-*.tar.gz \
            --report-dir build/package-audit \
            --expected-version 0.1.0

  windows-package:
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Activate MSVC toolchain
        shell: pwsh
        run: platforms/windows/export-msvc-env.ps1 -EnvironmentFile $env:GITHUB_ENV
      - name: Install pinned Emscripten SDK
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP "emsdk"
          git init $sdk
          git -C $sdk remote add origin https://github.com/emscripten-core/emsdk.git
          git -C $sdk fetch --depth 1 origin dfb9d1a46c3bb8f52e1e6324be23123b9d73c190
          git -C $sdk checkout --detach FETCH_HEAD
          & (Join-Path $sdk "emsdk.bat") install 6.0.5
          & (Join-Path $sdk "emsdk.bat") activate 6.0.5
          "EMSDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build optimized Web artifacts
        shell: pwsh
        run: |
          & "$env:EMSDK\emsdk_env.ps1"
          cmake --preset wasm-release
          cmake --build --preset wasm-release
          npm --prefix apps/web ci
          npm --prefix apps/web run build
      - name: Build and exercise portable Windows distribution
        shell: pwsh
        run: |
          cmake --preset package-release
          cmake --build --preset package-release
          cpack --config build/package-release/CPackConfig.cmake -B build/packages
          $archives = @(Get-ChildItem -Path build/packages -File -Filter "mol-keyboard-*.zip")
          if ($archives.Count -ne 1) {
            throw "Expected exactly one Windows portable archive, found $($archives.Count)."
          }
          python tools/package_audit.py `
            --archive $archives[0].FullName `
            --report-dir build/package-audit `
            --expected-version 0.1.0

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure and build coverage target
        run: |
          cmake --preset coverage-clang
          cmake --build --preset coverage-clang
      - name: Enforce core coverage thresholds
        run: |
          clang_major="$(clang -dumpversion | cut -d. -f1)"
          llvm_profdata="$(command -v llvm-profdata || command -v "llvm-profdata-$clang_major")"
          llvm_cov="$(command -v llvm-cov || command -v "llvm-cov-$clang_major")"
          test -x "$llvm_profdata"
          test -x "$llvm_cov"
          python3 tools/coverage_gate.py \
            --build-dir build/coverage-clang \
            --source-dir . \
            --llvm-profdata "$llvm_profdata" \
            --llvm-cov "$llvm_cov"

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure and build analysis target
        run: |
          cmake --preset static-analysis-clang
          cmake --build --preset static-analysis-clang
      - name: Analyze first-party production sources
        run: python3 tools/static_analysis.py --build-dir build/static-analysis-clang

  thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure and build ThreadSanitizer target
        run: |
          cmake --preset tsan-clang
          cmake --build --preset tsan-clang
      - name: Test concurrent production paths
        run: ctest --preset tsan-clang

  endurance:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build optimized endurance targets
        run: |
          cmake --preset endurance
          cmake --build --preset endurance
      - name: Run simulated 30-minute performance and recovery tests
        run: ctest --test-dir build/endurance --output-on-failure -L endurance

  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install exact Android SDK packages
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6" \
            "system-images;android-35;google_apis;x86_64"
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 origin dfb9d1a46c3bb8f52e1e6324be23123b9d73c190
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.5
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.5
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
      - name: Build Android application and device test
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          platforms/android/build-app.sh Debug
          MOL_SKIP_WEB_BUILD=1 platforms/android/build-app.sh DebugAndroidTest
          MOL_SKIP_WEB_BUILD=1 platforms/android/build-app.sh Release
          (
            cd platforms/android
            ./gradlew :app:lintDebug --no-daemon --no-configuration-cache
          )
      - name: Run packaged application in the Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chown "$USER" /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          adb_path="$ANDROID_HOME/platform-tools/adb"
          avdmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          emulator_path="$ANDROID_HOME/emulator/emulator"
          mkdir -p "$ANDROID_AVD_HOME" build
          echo no | "$avdmanager_path" create avd \
            --force \
            --name mol_android_ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_6
          "$emulator_path" -avd mol_android_ci \
            -no-window \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -no-metrics >build/android-emulator.log 2>&1 &
          emulator_pid=$!
          cleanup() {
            "$adb_path" emu kill >/dev/null 2>&1 || true
            for attempt in $(seq 1 20); do
              if ! kill -0 "$emulator_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            kill "$emulator_pid" 2>/dev/null || true
            wait "$emulator_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          timeout 120 "$adb_path" wait-for-device
          for attempt in $(seq 1 60); do
            if [ "$("$adb_path" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              tail -n 200 build/android-emulator.log
              exit 1
            fi
            sleep 2
          done
          python3 tools/android_emulator_gate.py \
            --adb "$adb_path" \
            --debug-apk platforms/android/app/build/outputs/apk/debug/app-debug.apk \
            --test-apk platforms/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --report build/android-emulator-gate.json || {
              tail -n 200 build/android-emulator.log
              exit 1
            }

  ios:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 origin dfb9d1a46c3bb8f52e1e6324be23123b9d73c190
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.5
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.5
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
      - name: Build simulator and device applications
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"
          platforms/ios/build-app.sh Simulator
          MOL_SKIP_WEB_BUILD=1 platforms/ios/build-app.sh Device
      - name: Launch simulator and verify packaged UI bridge
        shell: bash
        run: MOL_SKIP_IOS_BUILD=1 platforms/ios/run-simulator-smoke.sh
